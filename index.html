<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistencia interactiva</title>
<style>
:root{font-family:Montserrat,system-ui,sans-serif;color:#f8fafc;background:#111827}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111827}.app{width:min(1280px,96vw);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;color:#cbd5e1;margin-bottom:12px}.stage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.7fr);gap:18px}.room{position:relative;aspect-ratio:1.38;background:#9a6d4a;border:10px solid #d7c4a8;border-radius:18px;overflow:hidden;box-shadow:inset 0 0 50px #0003}.walltop{position:absolute;top:0;left:0;right:0;height:5%;background:#d8c5a8}.windows{position:absolute;right:0;top:5%;bottom:0;width:3.2%;background:repeating-linear-gradient(to bottom,#dff6ff 0 12%,#78cddd 12% 14%);border-left:3px solid #66c6d5}.board{position:absolute;bottom:1%;left:20%;width:58%;height:4%;background:#f5f7f7;border:4px solid #7d8b8c;border-radius:4px}.teacher{position:absolute;right:6%;bottom:5%;width:19%;height:10%;background:#7b4d2d;border:3px solid #5b351f;border-radius:5px}.teacher:after{content:"MESA PROFESOR";position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(7px,1vw,12px);font-weight:900;color:#f5dfc9}.speaker{position:absolute;bottom:2%;left:14%;width:4%;aspect-ratio:1;background:#eee;border:3px solid #9ca3af;border-radius:5px}.shelf{position:absolute;left:1%;bottom:8%;width:7%;height:34%;background:#486274;border:4px solid #304756}.door{position:absolute;left:0;bottom:44%;width:8%;height:17%;background:#7d3529;border:3px solid #532219}.mural{position:absolute;left:0;top:8%;width:4%;height:27%;background:#7b2638;border:5px solid #c99b62}.altar{position:absolute;right:1.5%;bottom:3%;width:4%;height:9%;background:#eee8dc;border:2px solid #c9b79e}.altar:after{content:"✝";display:grid;place-items:center;height:100%;color:#79552d;font-size:20px}
.seats{position:absolute;inset:7% 5% 17% 10%}.group{position:absolute;display:grid;gap:3px}.desk{position:relative;background:#c99a62;border:2px solid #875f3d;border-radius:5px;box-shadow:0 3px 5px #0004;aspect-ratio:1.45;transition:.2s}.desk:before{content:"";position:absolute;left:15%;right:15%;top:-10%;height:13%;border-radius:8px 8px 2px 2px;background:#d8ad7c;border:2px solid #875f3d}.desk.active{z-index:4;animation:pulse 1s infinite;background:#60a5fa;box-shadow:0 0 8px #fff,0 0 28px #38bdf8,0 0 55px #0ea5e9}.desk.present{background:#4ade80}.desk.absent{background:#f87171}.desk.unassigned{opacity:.45}@keyframes pulse{50%{transform:scale(1.1);filter:brightness(1.25)}}.left{left:2%;top:2%;width:22%;height:78%;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr);row-gap:7%}.middle{left:34%;top:2%;width:34%;height:96%;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(7,1fr);row-gap:3%}.right{right:2%;top:2%;width:22%;height:96%;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(7,1fr);row-gap:3%}
.panel{background:#ffffff10;border:1px solid #ffffff20;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:420px}.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:#94a3b8;font-weight:800}.name{font-size:clamp(2rem,4vw,4rem);line-height:1.02;margin:18px 0 26px}.buttons{display:grid;gap:10px}.btn{border:0;border-radius:14px;padding:15px 18px;color:#fff;font-weight:900;font-size:1rem;cursor:pointer}.presentBtn{background:#16a34a}.absentBtn{background:#dc2626}.secondary{background:#475569}.primary{background:#2563eb}.hint{font-size:.8rem;color:#94a3b8;margin-top:14px}.setup{background:#ffffff0c;border-radius:16px;padding:12px 16px;margin-bottom:14px}.setup summary{cursor:pointer;font-weight:800}.setup input,.setup textarea{width:100%;margin-top:9px;padding:10px;border-radius:9px;background:#0f172a;color:white;border:1px solid #475569}.setup textarea{min-height:120px}.setup button{margin-top:8px}.assign{display:none;margin-top:12px;max-height:42vh;overflow:auto;text-align:left}.assign-row{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:5px 0}.assign select{width:100%;padding:6px;background:#0f172a;color:white;border:1px solid #475569;border-radius:6px}.summary{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.stat{background:#ffffff10;padding:14px;border-radius:12px}.stat b{display:block;font-size:2rem}.abslist{text-align:left;max-height:180px;overflow:auto}.empty{color:#cbd5e1}@media(max-width:850px){.stage{grid-template-columns:1fr}.panel{min-height:300px}.app{width:100%;padding:10px}.room{aspect-ratio:1.15}}
</style></head><body><main class="app">
<details class="setup" id="setup"><summary>⚙ Configurar curso y puestos</summary><input id="courseInput" placeholder="Nombre del curso"><textarea id="studentInput" placeholder="Un estudiante por línea"></textarea><button class="btn primary" id="saveList">Guardar nómina</button><button class="btn secondary" id="assignBtn">Asignar estudiantes a puestos</button><div class="assign" id="assign"></div></details>
<div class="top"><span id="courseTitle">Asistencia interactiva</span><b id="progress"></b></div>
<div class="stage"><div class="room"><div class="walltop"></div><div class="windows"></div><div class="mural"></div><div class="door"></div><div class="shelf"></div><div class="speaker"></div><div class="board"></div><div class="teacher"></div><div class="altar"></div><div class="seats"><div class="group left" id="left"></div><div class="group middle" id="middle"></div><div class="group right" id="right"></div></div></div>
<section class="panel" id="panel"><div id="empty" class="empty"><h2>Configura tu curso</h2><p>La nómina y la ubicación de los estudiantes se guardan solamente en este dispositivo.</p></div><div id="attendance" style="display:none"><div class="eyebrow">¿Está presente?</div><h1 class="name" id="studentName"></h1><div class="buttons"><button class="btn presentBtn" id="presentBtn">P · Presente</button><button class="btn absentBtn" id="absentBtn">A · Ausente</button><button class="btn secondary" id="undoBtn">← Corregir anterior</button></div><div class="hint">El puesto azul indica dónde se sienta · P / A / ←</div></div><div class="summary" id="summary"><div class="eyebrow">Lista terminada</div><h2>Resumen</h2><div class="stats"><div class="stat"><b id="total">0</b>Total</div><div class="stat"><b id="pres">0</b>Presentes</div><div class="stat"><b id="abs">0</b>Ausentes</div></div><div class="abslist" id="abslist"></div><button class="btn primary" id="restart">Pasar lista nuevamente</button></div></section></div>
</main><script>
const $=id=>document.getElementById(id),KEY='attendanceRoomV2';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{course:'',students:[],seatMap:{}};let index=0,history=[],locked=false;
const seatIds=[];function makeSeats(id,n){const g=$(id);for(let i=0;i<n;i++){const d=document.createElement('div');d.className='desk';const sid=id+'-'+(i+1);d.dataset.seat=sid;d.title=sid;g.appendChild(d);seatIds.push(sid)}}makeSeats('left',10);makeSeats('middle',21);makeSeats('right',14);
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function studentSeat(name){return Object.keys(data.seatMap).find(k=>data.seatMap[k]===name)}
function paint(){document.querySelectorAll('.desk').forEach(d=>{d.className='desk';const who=data.seatMap[d.dataset.seat];if(!who)d.classList.add('unassigned');const h=history.find(x=>x.name===who);if(h)d.classList.add(h.status==='P'?'present':'absent')});if(index<data.students.length){const s=studentSeat(data.students[index]);if(s){const d=document.querySelector('[data-seat="'+s+'"]');if(d){d.className='desk active'}}}}
function render(){paint();$('courseTitle').textContent=(data.course||'Curso')+' · Asistencia';if(!data.students.length){$('empty').style.display='block';$('attendance').style.display='none';$('summary').style.display='none';$('progress').textContent='';return}if(index>=data.students.length)return finish();$('empty').style.display='none';$('attendance').style.display='block';$('summary').style.display='none';$('studentName').textContent=data.students[index];$('progress').textContent=(index+1)+' / '+data.students.length;$('undoBtn').disabled=!history.length;locked=false}
function mark(status){if(locked||index>=data.students.length)return;locked=true;history.push({name:data.students[index],status});index++;setTimeout(render,100)}function undo(){if(!history.length)return;history.pop();index--;render()}
function finish(){paint();$('attendance').style.display='none';$('summary').style.display='block';const p=history.filter(x=>x.status==='P'),a=history.filter(x=>x.status==='A');$('total').textContent=data.students.length;$('pres').textContent=p.length;$('abs').textContent=a.length;$('abslist').innerHTML=a.length?'<b>Ausentes:</b><br>'+a.map(x=>'• '+x.name).join('<br>'):'<b>Sin ausentes</b>';$('progress').textContent='Finalizado';locked=false}
function buildAssign(){const box=$('assign');box.innerHTML='<p><b>Asigna cada puesto.</b> La información queda solo en este navegador.</p>';seatIds.forEach((sid,i)=>{const row=document.createElement('div');row.className='assign-row';const lab=document.createElement('label');lab.textContent='Puesto '+(i+1);const sel=document.createElement('select');sel.dataset.sid=sid;sel.innerHTML='<option value="">— Vacío —</option>'+data.students.map(n=>'<option></option>').join('');[...sel.options].slice(1).forEach((o,j)=>{o.value=data.students[j];o.textContent=data.students[j]});sel.value=data.seatMap[sid]||'';sel.onchange=()=>{const val=sel.value;if(val){for(const k in data.seatMap)if(data.seatMap[k]===val)delete data.seatMap[k];data.seatMap[sid]=val}else delete data.seatMap[sid];save();buildAssign();paint()};row.append(lab,sel);box.appendChild(row)});box.style.display='block'}
$('courseInput').value=data.course;$('studentInput').value=data.students.join('\n');$('saveList').onclick=()=>{const list=$('studentInput').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!list.length)return alert('Agrega estudiantes.');data.course=$('courseInput').value.trim()||'Mi curso';data.students=list;for(const k in data.seatMap)if(!list.includes(data.seatMap[k]))delete data.seatMap[k];save();index=0;history=[];$('setup').open=false;render()};$('assignBtn').onclick=buildAssign;$('presentBtn').onclick=()=>mark('P');$('absentBtn').onclick=()=>mark('A');$('undoBtn').onclick=undo;$('restart').onclick=()=>{index=0;history=[];render()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key.toUpperCase()==='P')mark('P');else if(e.key.toUpperCase()==='A')mark('A');else if(e.key==='ArrowLeft')undo()});if(!data.students.length)$('setup').open=true;render();
</script></body></html>
