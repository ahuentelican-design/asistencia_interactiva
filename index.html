<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistencia 5° Básico A</title>
<style>
:root{font-family:Montserrat,system-ui,-apple-system,sans-serif;color:#fff;background:#0f172a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#334155,#0f172a 65%);display:grid;place-items:center}.app{width:min(1050px,94vw);text-align:center}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:22px;color:#cbd5e1}.progress{font-weight:800}.card{min-height:55vh;border:1px solid #ffffff26;border-radius:32px;background:#ffffff10;backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:34px;box-shadow:0 24px 80px #0005}.eyebrow{text-transform:uppercase;letter-spacing:.18em;color:#94a3b8;font-size:.8rem;font-weight:800}.name{font-size:clamp(2.6rem,8vw,6.5rem);line-height:1;margin:20px 0 30px}.buttons{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:18px;padding:18px 30px;color:white;font-size:1.05rem;font-weight:900;cursor:pointer;min-width:190px}.present{background:#16a34a}.absent{background:#dc2626}.undo{background:#475569;margin-top:12px;padding:10px 20px;min-width:auto}.hint{margin-top:20px;color:#94a3b8}.summary{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;width:100%}.stat{background:#ffffff12;border-radius:22px;padding:25px}.stat strong{display:block;font-size:3rem}.restart{margin-top:25px;background:#2563eb}.absent-list{margin-top:24px;width:min(620px,100%);text-align:left;background:#ffffff0b;padding:18px 24px;border-radius:18px}.absent-list h2{font-size:1rem;margin:0 0 10px;color:#cbd5e1}.absent-list ul{margin:0;padding-left:22px;columns:2}.setup{margin-bottom:20px;text-align:left;background:#ffffff0b;padding:16px;border-radius:18px}.setup summary{cursor:pointer;font-weight:800}.setup textarea{width:100%;min-height:160px;margin-top:14px;border-radius:12px;padding:12px;background:#0f172a;color:#fff;border:1px solid #475569}.setup button{margin-top:10px;padding:10px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}@media(max-width:650px){.stats{grid-template-columns:1fr}.absent-list ul{columns:1}.top{font-size:.9rem}.card{min-height:62vh}.btn{width:100%}.undo{width:auto}}
</style>
</head>
<body><main class="app">
<details class="setup"><summary>Administrar lista de 5° Básico A</summary><textarea id="studentInput" aria-label="Lista de estudiantes"></textarea><button id="loadBtn">Guardar lista en este dispositivo</button></details>
<section id="attendance"><div class="top"><span>5° Básico A · Asistencia</span><span class="progress" id="progress"></span></div><div class="card"><div class="eyebrow">¿Está presente?</div><h1 class="name" id="studentName"></h1><div class="buttons"><button class="btn present" id="presentBtn">P · Presente</button><button class="btn absent" id="absentBtn">A · Ausente</button></div><button class="btn undo" id="undoBtn">← Corregir anterior</button><div class="hint">Teclado: <b>P</b> presente · <b>A</b> ausente · <b>←</b> corregir</div></div></section>
<section class="summary" id="summary"><div class="card"><div class="eyebrow">Lista terminada</div><h1>Resumen de asistencia</h1><div class="stats"><div class="stat"><strong id="totalStat">0</strong>Total</div><div class="stat"><strong id="presentStat">0</strong>Presentes</div><div class="stat"><strong id="absentStat">0</strong>Ausentes</div></div><div class="absent-list" id="absentBox"><h2>Estudiantes ausentes</h2><ul id="absentNames"></ul></div><button class="btn restart" id="restartBtn">Pasar lista nuevamente</button></div></section>
</main><script>
const roster=[
'Ayleen Almonacid','Gaspar Altamirano','Santiago Altamirano','Leonor Alumini','Maximiliano Alvarez','Martina Aniñir','Cristobal Araya','Amanda Aro','Simon Barria','Lucas Barrientos','Mauro Basualto','Erwin Bohle','Mateo Cardenas','Noelia Colillanca','Maximiliano Díaz','Facundo Fuentes','José Fuentes','Isidora Hernández','Agustin Hueitra','Constanza Inostroza','Maite Kortmann','Vicente Kortmann','Lucas Maldonado','Mía Mancilla','Ada Miranda','Antonella Muñoz','Martín Nain','Florencia Nuñez','Ángel Ojeda','Isidora Ortiz','Leonor Pailahual','Thomás Paredes','Alisson Riffo','Amelia Rojas','Laura Ruiz','Valentina Ruiz','Tomás Tavie','Noelia Toledo','Valentina Torres','Isidora Usabiaga','Reimundo Vasquez','Maria Villarroel','Colomba Villarroel','Josefa Yunge','Itze Zerpa'];
let students=JSON.parse(localStorage.getItem('attendanceStudents')||'null')||roster;let index=0,history=[],locked=false;const $=id=>document.getElementById(id);
function syncInput(){$('studentInput').value=students.join('\n')}
function counts(){return{p:history.filter(x=>x.status==='P').length,a:history.filter(x=>x.status==='A').length}}
function render(){if(index>=students.length)return finish();$('attendance').style.display='block';$('summary').style.display='none';$('studentName').textContent=students[index];$('progress').textContent=`${index+1} / ${students.length}`;$('undoBtn').disabled=!history.length;locked=false}
function mark(status){if(locked||index>=students.length)return;locked=true;history.push({name:students[index],status});index++;setTimeout(render,100)}
function undo(){if(!history.length)return;history.pop();index=Math.max(0,index-1);render()}
function finish(){const c=counts();$('attendance').style.display='none';$('summary').style.display='block';$('totalStat').textContent=students.length;$('presentStat').textContent=c.p;$('absentStat').textContent=c.a;const absent=history.filter(x=>x.status==='A').map(x=>x.name);$('absentNames').innerHTML=absent.map(n=>`<li>${n}</li>`).join('');$('absentBox').style.display=absent.length?'block':'none';locked=false}
function reset(){index=0;history=[];render()}
$('presentBtn').onclick=()=>mark('P');$('absentBtn').onclick=()=>mark('A');$('undoBtn').onclick=undo;$('restartBtn').onclick=reset;$('loadBtn').onclick=()=>{const list=$('studentInput').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!list.length)return;students=list;localStorage.setItem('attendanceStudents',JSON.stringify(students));document.querySelector('.setup').open=false;reset()};document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const k=e.key.toUpperCase();if(k==='P'||k==='A')mark(k);else if(e.key==='ArrowLeft')undo()});syncInput();render();
</script></body></html>
